<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="TC Tracker: Turismo Carretera news, race countdown and Parana weather.">
    <meta name="author" content="Ezequiel Lezcano">
    <title>TC Tracker | Home</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="styles/main.css">
    <script type="module" src="scripts/index.js"></script>
</head>

<body>
    <header class="site-header"><a class="brand" href="index.html"><img src="images/tctracker_logo.png"
                alt="TC Tracker logo"><span>TC TRACKER</span></a><button id="menu" aria-label="Open menu">Menu</button>
        <nav id="nav"><a aria-current="page" href="index.html">Home</a><a href="drivers.html">Drivers</a><a
                href="circuits.html">Circuits</a></nav>
    </header>
    <main>
        <section class="hero"><img src="images/tc-hero.webp" alt="Turismo Carretera race car">
            <div>
                <p>2026 SEASON · ROUND 10</p>
                <h1>Turismo Carretera at Parana</h1>
                <p>Parana City Racetrack · 22–23 August 2026</p>
            </div>
        </section>
        <section>
            <h2>Next race</h2>
            <div class="timer" id="countdown"></div>
            <div class="weather" id="weather"><span class="weather-icon">☁</span>
                <div><strong>Parana race weekend</strong>
                    <p>Loading weather data…</p>
                </div>
            </div>
        </section>
        <section>
            <h2>Latest news</h2>
            <div id="news" class="grid"></div>
        </section>
        <section>
            <div class="section-heading">
                <h2>Featured drivers</h2><a href="drivers.html">View all drivers →</a>
            </div>
            <div id="featured-drivers" class="grid"></div>
        </section>
        <section>
            <h2>Stay in the loop</h2>
            <form action="thankyou.html" method="get"><label>Name <input name="name" required></label><label>Email
                    <input name="email" type="email" required></label><button>Subscribe</button></form>
        </section>
    </main>
    <footer>
        <p>© <span id="year"></span> TC Tracker · <a href="attributions.html">Attributions</a></p>
    </footer>
</body>

</html>
